<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>到達那微秒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
/* 版面：上面一條標題列，中間整頁 3D 或表世界，下面固定分頁列（延續 v4 的活頁簿） */
:root{
  --bg:#E6ECF1; --panel:#F7F9FB; --panel2:#EEF2F6; --ink:#16212D; --muted:#586676; --line:#C7D1DB;
  --brass:#A2731F; --brass-soft:#F1E4C8; --teal:#1C7A73; --teal-soft:#D5ECE9; --rose:#9C4450; --rose-soft:#F3DDE0; --blue:#2D5A86;
  --hud:rgba(247,249,251,.88); --grid:#D5DDE5; --blue-soft:#DCE7F2;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --r-s:6px; --r-m:10px; --tabs-h:46px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0D141B; --panel:#151F29; --panel2:#1B2733; --ink:#E2E9F0; --muted:#93A1B0; --line:#2B3947;
  --brass:#D8A954; --brass-soft:#3A2E17; --teal:#43B5AA; --teal-soft:#15332F; --rose:#D57F8B; --rose-soft:#3A1E23; --blue:#7FA9D6;
  --hud:rgba(21,31,41,.88); --grid:#26333F; --blue-soft:#1C2C3D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D141B; --panel:#151F29; --panel2:#1B2733; --ink:#E2E9F0; --muted:#93A1B0; --line:#2B3947;
  --brass:#D8A954; --brass-soft:#3A2E17; --teal:#43B5AA; --teal-soft:#15332F; --rose:#D57F8B; --rose-soft:#3A1E23; --blue:#7FA9D6;
  --hud:rgba(21,31,41,.88); --grid:#26333F; --blue-soft:#1C2C3D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.3;margin:0}
h2{font-size:1.2rem;text-wrap:balance}
p{margin:.4em 0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.top{flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:6px 16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;white-space:nowrap}
.ver{font-size:.78rem;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:0 8px}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--muted)}

.view{flex:1;min-height:0;position:relative}
#view-sheet{overflow:auto;padding:12px 16px calc(var(--tabs-h) + 20px + env(safe-area-inset-bottom,0px))}
#stage{position:absolute;inset:0}
#stage canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.label{position:absolute;left:0;top:0;font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--hud);border:1px solid var(--line);color:var(--ink);white-space:nowrap;will-change:transform}
.label.rule{color:var(--teal)} .label.problem{color:var(--muted)} .label.goal{color:var(--brass)} .label.fusion,.label.stage{color:var(--blue)}
.whiteflash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
.whiteflash.go{animation:whiteflash .9s ease-out forwards}
@keyframes whiteflash{0%{opacity:1}100%{opacity:0}}

/* HUD：貼在 3D 上面的幾個小板子 */
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px 16px calc(var(--tabs-h) + 12px + env(safe-area-inset-bottom,0px))}
.hud>*{pointer-events:auto}
.hud-top{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pane{background:var(--hud);border:1px solid var(--line);border-radius:var(--r-m);padding:8px 12px;backdrop-filter:blur(6px);max-width:100%}
.where{font-size:.84rem;color:var(--muted)}
.code{font-family:var(--serif);font-size:1.6rem;letter-spacing:.12em;line-height:1.1;color:var(--brass);font-variant-numeric:tabular-nums}
.hint{font-size:.8rem;color:var(--muted)}
.goal{font-size:.95rem;color:var(--teal);font-weight:500}
.route{font-size:.86rem;line-height:1.5;max-width:36em;flex-basis:100%}
.route s{color:var(--muted)}
.route select{min-height:28px;padding:0 4px;font-size:.8rem;margin-left:4px}
.me{display:flex;align-items:center;gap:4px;white-space:nowrap} .me input{width:20px;height:20px;margin:0}
.hud-mid{display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:36em}
.near b{display:block;font-family:var(--serif);color:var(--teal)}
.near span{white-space:pre-line;font-size:.9rem}
.msg{background:var(--ink);color:var(--panel);border-radius:var(--r-m);padding:8px 12px;font-size:.92rem;max-width:36em}
.hud-bottom{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:40px;padding:6px 16px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.sm{min-height:32px;padding:2px 10px;font-size:.84rem}
.hud .btn{box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* 表世界：活頁簿（沿用 v4 的做法） */
.fxbar{flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--panel)}
.fxbar .back{border:0;border-right:1px solid var(--line);background:transparent;padding:0 12px;cursor:pointer;min-height:34px;white-space:nowrap}
.fxbar .back:disabled{opacity:.35;cursor:default}
.namebox{width:8em;flex:none;border-right:1px solid var(--line);padding:6px 10px;font-variant-numeric:tabular-nums;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx{flex:none;padding:6px 8px;color:var(--muted);font-style:italic;border-right:1px solid var(--line);font-family:var(--serif)}
.fxval{flex:1;min-width:0;padding:6px 10px;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view-sheet{overflow:auto;padding:12px 16px calc(var(--tabs-h) + 20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.sheet-head .no{font-family:var(--serif);color:var(--brass);font-weight:700}
.sheet-desc{color:var(--muted);font-size:.86rem;margin:0 0 8px;max-width:44em}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
h3.tt{font-family:var(--serif);font-size:1rem;margin:14px 0 4px}
.wb{overflow:auto;border:1px solid var(--line);background:var(--panel);-webkit-overflow-scrolling:touch;max-width:100%}
.ws{border-collapse:separate;border-spacing:0;font-size:.88rem;width:max-content;min-width:100%}
.ws th,.ws td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:5px 8px;text-align:left;vertical-align:top;background:var(--panel);white-space:nowrap}
.ws td{max-width:22em}
.ws td.wrap{white-space:normal;min-width:12em}
.ws thead th{position:sticky;z-index:3;background:var(--panel2);font-weight:500}
.ws thead tr.letters th{top:0;height:22px;padding:1px 8px;font-size:.72rem;color:var(--muted);text-align:center}
.ws thead tr.names th{top:22px;font-size:.82rem}
.ws .rn{position:sticky;left:0;z-index:2;background:var(--panel2);color:var(--muted);text-align:right;font-size:.74rem;min-width:2.6rem;width:2.6rem;padding:5px 4px;font-variant-numeric:tabular-nums}
.ws thead .rn{z-index:4}
.ws .fz{position:sticky;left:2.6rem;z-index:1;box-shadow:1px 0 0 var(--line)}
.ws thead .fz{z-index:4}
.ws td.n,.ws th.n{text-align:right;font-variant-numeric:tabular-nums}
.ws tbody tr:hover > td:not(.rn){background:var(--panel2)}
.ws td.sel{outline:2px solid var(--brass);outline-offset:-2px}
.ws tr.flash > td{animation:rowflash 1.6s ease-out}
@keyframes rowflash{0%,40%{background:var(--brass-soft)}100%{background:var(--panel)}}
.ws tr.addrow > td{background:var(--blue-soft);vertical-align:middle}
.ws tr.mine > td.fz{box-shadow:inset 3px 0 0 var(--teal),1px 0 0 var(--line)}
.ws tr.next > td{background:var(--brass-soft)}
.ws input[type=text],.ws input[type=number],.ws select{min-height:32px;padding:3px 6px}
.ws input[type=text]{width:11em} .ws input.xy{width:4.2em} .ws input.kc{width:5.5em}
.ws td .btn{margin:1px 0}
.auto{color:var(--muted);font-size:.78rem;font-style:italic}
.lk{all:unset;cursor:pointer;color:var(--blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.lk:focus-visible{outline:2px solid var(--brass)}
.empty{padding:12px;color:var(--muted);font-size:.88rem}
.nextbar{display:flex;justify-content:flex-end;margin:16px 0 0}
.tag{font-size:.74rem;padding:1px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.tag.shelve,.tag.exit,.tag.dispute,.tag.shelved,.tag.exited{background:var(--rose-soft);color:var(--rose)}
.tag.open,.tag.doing,.tag.judging,.tag.proposed,.tag.wait{background:var(--brass-soft);color:var(--brass)}
.tag.done,.tag.meet,.tag.fused,.tag.agreed,.tag.ok{background:var(--teal-soft);color:var(--teal)}
.tag.todo{background:var(--panel2);color:var(--muted)}
.me{display:flex;align-items:center;gap:4px;white-space:nowrap} .me input{width:20px;height:20px;margin:0}
#sheetMsg{margin-top:8px}
.msg{background:var(--ink);color:var(--panel);border-radius:var(--r-m);padding:8px 12px;font-size:.92rem;max-width:36em}

/* 分頁列：可左右滑 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:flex-end;overflow-x:auto;background:var(--panel2);border-top:1px solid var(--line);
  padding:0 8px env(safe-area-inset-bottom,0px);height:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));scrollbar-width:thin}
.tabs a{flex:none;display:flex;align-items:center;height:36px;padding:0 12px;text-decoration:none;color:var(--ink);font-size:.88rem;white-space:nowrap;border:1px solid transparent;border-bottom:0;border-radius:var(--r-s) var(--r-s) 0 0;cursor:pointer}
.tabs a b{font-family:var(--serif);color:var(--brass);margin-right:4px}
.tabs a[aria-current="page"]{background:var(--panel);border-color:var(--line);font-weight:700;box-shadow:inset 0 -3px 0 var(--brass)}
.tabs .sep{flex:none;width:1px;height:22px;background:var(--line);margin:7px 6px;align-self:flex-start}

/* 相遇 */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;max-width:30em;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.overlay h2{color:var(--brass);margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <span class="brand">到達那微秒</span><span class="ver">v5 原型</span>
  <span class="clock" id="clock"></span>
</div></header>

<div class="fxbar" id="fxbar" hidden>
  <button type="button" class="back" id="backBtn" disabled aria-label="返回上一張表">← 返回</button>
  <div class="namebox" id="nameBox" aria-label="名稱方塊">—</div>
  <div class="fx" aria-hidden="true">fx</div>
  <div class="fxval" id="fxVal" aria-label="儲存格內容"></div>
</div>
<main id="view-world" class="view">
  <div id="stage"></div>
  <div class="hud">
    <div class="hud-top">
      <div class="pane" id="hudCodeBox"><div class="where" id="hudWhere"></div><div class="code" id="hudCode">—</div><div class="hint" id="hudCodeHint"></div></div>
      <div class="pane goal" id="hudGoal" hidden></div>
      <div class="pane route" id="hudRoute" hidden><span id="hudRouteText"></span> <select id="hudTarget" aria-label="要去哪個代號"></select></div>
    </div>
    <div class="hud-mid">
      <div class="pane near" id="hudNear" hidden><b id="hudNearTitle"></b><span id="hudNearBody"></span></div>
      <div class="msg" id="hudMsg" hidden></div>
    </div>
    <div class="hud-bottom">
      <button class="btn pri" id="btnCircle" hidden>繞一圈</button>
      <button class="btn" id="btnReset">重走</button>
      <button class="btn" id="btnOpen" hidden>打開融合</button>
      <button class="btn" id="btnHome" hidden>回自己的世界</button>
    </div>
  </div>
</main>

<main id="view-sheet" class="view" hidden><div id="main"></div></main>

<nav class="tabs" id="tabs" aria-label="工作表"></nav>

<div class="overlay" id="meet" hidden><div class="card">
  <h2>到達那微秒</h2>
  <p id="meetText"></p>
  <p class="muted small" id="meetProblems"></p>
  <p class="muted small">接下來：約下一個出發點、拆成階段、分工、判定、填熱量。</p>
  <div class="tools"><button class="btn pri" id="meetOpen">打開融合</button><button class="btn" id="meetClose">回自己的世界</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== 資料層：規則與資料，不碰畫面 =====
 * 這一層只有純資料和純函式，node 也能跑（v5/tests/data.test.js）。
 * 世界只能是資料：一個角色的世界 = 序號、功能點、走法表、路、出發點、規則、難題。
 */
var DATA = (function () {
  'use strict';

  /* ---------- 角色序號：11 位數，開頭幾個 0 就用第幾個字母 ---------- */
  function abbrev(serial) {
    var m = /^(0*)(\d*)$/.exec(serial);
    if (!m || serial.length !== 11) return null;
    var z = m[1].length;
    if (z === 0) return serial;
    if (z === 11) return null;                 // 全 0 不是角色
    return String.fromCharCode(64 + z) + m[2];
  }
  function expand(code) {
    if (/^\d{11}$/.test(code) && code[0] !== '0') return code;
    var m = /^([A-J])(\d+)$/.exec(String(code).toUpperCase());
    if (!m) return null;
    var z = m[1].charCodeAt(0) - 64;
    if (z + m[2].length !== 11 || m[2][0] === '0') return null;
    return '0'.repeat(z) + m[2];
  }
  // 字母告訴你後面有幾位數
  function digitsAfter(letter) { return 11 - (letter.charCodeAt(0) - 64); }

  /* ---------- 功能：功能固定，外觀自由 ---------- */
  var FUNCS = {
    rule:    { label: '規則', visible: 'cond',   defaultLook: '屋' },
    problem: { label: '難題', visible: 'cond',   defaultLook: '碑' },
    goal:    { label: '終點', visible: 'all',    defaultLook: '台' },
    fusion:  { label: '融合', visible: 'member', defaultLook: '殿' },
    stage:   { label: '階段', visible: 'member', defaultLook: '工坊' },
    none:    { label: '地標', visible: 'all',    defaultLook: '—' }
  };
  var SHAPES = { box: '方塊', cylinder: '圓柱', sphere: '球', cone: '錐' };

  /* ---------- 預設外觀（都是基本形體的組合；主人隨時可改） ---------- */
  var LOOKS = {
    '屋': function (c) { return [
      { shape: 'box', size: [3, 2.2, 3], color: c, offset: [0, 1.1, 0] },
      { shape: 'cone', size: [4, 1.5, 4], color: '#7A4B32', offset: [0, 2.95, 0] } ]; },
    '碑': function (c) { return [
      { shape: 'box', size: [1.4, 3.4, 0.5], color: c, offset: [0, 1.7, 0] },
      { shape: 'box', size: [2.2, 0.4, 1.2], color: '#8A8F96', offset: [0, 0.2, 0] } ]; },
    '台': function (c) { return [
      { shape: 'cylinder', size: [3.2, 0.5, 3.2], color: c, offset: [0, 0.25, 0] },
      { shape: 'cylinder', size: [2.2, 0.5, 2.2], color: c, offset: [0, 0.75, 0] } ]; },
    '殿': function (c) { return [
      { shape: 'box', size: [4, 0.6, 4], color: '#8A8F96', offset: [0, 0.3, 0] },
      { shape: 'cylinder', size: [0.5, 3, 0.5], color: c, offset: [-1.4, 2.1, -1.4] },
      { shape: 'cylinder', size: [0.5, 3, 0.5], color: c, offset: [1.4, 2.1, -1.4] },
      { shape: 'cylinder', size: [0.5, 3, 0.5], color: c, offset: [-1.4, 2.1, 1.4] },
      { shape: 'cylinder', size: [0.5, 3, 0.5], color: c, offset: [1.4, 2.1, 1.4] },
      { shape: 'box', size: [4.2, 0.5, 4.2], color: c, offset: [0, 3.85, 0] } ]; },
    '工坊': function (c) { return [
      { shape: 'box', size: [3.6, 1.8, 2.6], color: c, offset: [0, 0.9, 0] },
      { shape: 'cylinder', size: [0.5, 1.6, 0.5], color: '#5C6670', offset: [1.2, 2.6, -0.6] } ]; },
    '樹': function (c) { return [
      { shape: 'cylinder', size: [0.6, 2, 0.6], color: '#7A4B32', offset: [0, 1, 0] },
      { shape: 'sphere', size: [3, 3, 3], color: c, offset: [0, 3.2, 0] } ]; },
    '井': function (c) { return [
      { shape: 'cylinder', size: [2.2, 1, 2.2], color: c, offset: [0, 0.5, 0] },
      { shape: 'cylinder', size: [1.4, 1.1, 1.4], color: '#1E2A36', offset: [0, 0.56, 0] } ]; },
    '噴泉': function (c) { return [
      { shape: 'cylinder', size: [3.4, 0.6, 3.4], color: c, offset: [0, 0.3, 0] },
      { shape: 'cylinder', size: [0.6, 1.6, 0.6], color: c, offset: [0, 1.4, 0] },
      { shape: 'sphere', size: [1.2, 1.2, 1.2], color: '#9CC9E8', offset: [0, 2.6, 0] } ]; },
    '山': function (c) { return [
      { shape: 'cone', size: [6, 5, 6], color: c, offset: [0, 2.5, 0] } ]; },
    '塔': function (c) { return [
      { shape: 'cylinder', size: [2, 4, 2], color: c, offset: [0, 2, 0] },
      { shape: 'cone', size: [2.4, 1.6, 2.4], color: '#5C6670', offset: [0, 4.8, 0] } ]; }
  };
  function look(name, color) { return LOOKS[name] ? LOOKS[name](color) : LOOKS['屋'](color); }

  // 物件的地面半徑：用來判斷「靠近」「到達」「繞圈」
  function radiusOf(obj) {
    var r = 0.8;
    (obj.parts || []).forEach(function (p) {
      var o = p.offset || [0, 0, 0];
      var rr = Math.hypot(o[0], o[2]) + Math.max(p.size[0], p.size[2]) / 2;
      if (rr > r) r = rr;
    });
    return r;
  }

  /* ---------- 難題與規則的輔助 ---------- */
  // 角色目前的難題：最後一個進行中或融合中的；出發點就是它的
  function activeProblem(r) {
    for (var i = (r.problems || []).length - 1; i >= 0; i--) if (r.problems[i].status === 'open' || r.problems[i].status === 'fused') return r.problems[i];
    return null;
  }
  // 目前生效的規則版本（最後一版）
  function currentRules(r) {
    var vs = r.ruleVersions || [];
    return vs.length ? vs[vs.length - 1] : { no: 0, atUs: 0, items: [], ratios: { idea: 100, battle: 100 }, resources: [] };
  }
  var pidSeq = 0;
  function newId(prefix) { return prefix + Date.now().toString(36) + (pidSeq++).toString(36); }
  // 立難題；prev 是擱置的前身（可不填）
  function addProblem(r, text, prev) {
    if (!text || !String(text).trim()) throw new Error('難題要寫內容');

      $('meetProblems').textContent = '融合難題：' + fu.text;
      $('meet').hidden = false;
    } else {
      var t2 = shelve(r, ' 沒有人到終點');
      DATA.save(state); refresh();
      $('hudGoal').textContent = '錯過了，擱置';
      msg(t2, true);
    }
  }, 50);
  $('meetClose').addEventListener('click', function () { $('meet').hidden = true; goHome(); });

  /* ---------- 共用：換角色、重設、分頁 ---------- */
  function becomeMe(i) {
    state.me = i; me = state.roles[i];
    dec = new DATA.Decoder(me.walk); target = null;
    DATA.save(state);
    goHome(); refresh();
  }
  function walkChanged() { DATA.save(state); dec = new DATA.Decoder(me.walk); drawCode(); drawNear(nearObj); }
  function resetAll() {
    state = DATA.fresh(); me = state.roles[0]; dec = new DATA.Decoder(me.walk); target = null; DATA.save(state);
    goHome(); refresh();
  }
  function showTab(name) {
    $('view-world').hidden = name !== 'world';
    $('view-sheet').hidden = name !== 'sheet';
    $('fxbar').hidden = name !== 'sheet';
    if (name === 'world') { WORLD.resize(); if (window.SHEET) SHEET.renderTabs(); }
    else refresh();
  }
  function worldRefresh(role, objId) { if (role === cur.role) { if (objId) WORLD.refreshObject(objId); else WORLD.loadWorld(role, { visiting: cur.visiting }); } }

  /* ---------- 開始 ---------- */
  if (typeof THREE === 'undefined') {
    $('hudMsg').hidden = false;
    $('hudMsg').textContent = '3D 引擎沒載入，請檢查網路後重新整理。表世界分頁還是能用。';
  } else {
    WORLD.init($('stage'));
    WORLD.loadWorld(me);
  }
  drawCode(); drawWhere(); drawNear(null);
  window.APP = {
    state: function () { return state; }, me: function () { return me; }, cur: function () { return cur; }, dec: function () { return dec; },
    save: function () { DATA.save(state); }, msg: msg, becomeMe: becomeMe, goHome: goHome, showTab: showTab, isWorld: function () { return $('view-world') && !$('view-world').hidden; },
    openPortal: function (code) { showTab('world'); if (cur.visiting) goHome(); dec.reset(); drawCode(); openPortal(code); },
    enterPortal: function () { if (portalRole) teleport(portalRole); }, teleportTo: teleport,
    walkChanged: walkChanged, worldRefresh: worldRefresh, resetAll: resetAll, record: record, refresh: refresh, esc: esc, opt: opt
  };
})();

/* ===== 表世界：活頁簿，一張表一頁（沿用 v4 的 SHEETS 設定、列號、凍結首欄、名稱方塊、跳轉與返回） =====

  var roleIdx = function (r) { return S().roles.indexOf(r); };
  var findProblem = function (pid) { var out = null; S().roles.forEach(function (r) { r.problems.forEach(function (p) { if (p.id === pid) out = { role: r, p: p }; }); }); return out; };
  var findStage = function (sid) { var out = null; S().fusions.forEach(function (f) { f.stages.forEach(function (st) { if (st.id === sid) out = { f: f, st: st }; }); }); return out; };

    }

  function prev(Lx, n) { var c = Lx.charCodeAt(0) - n; return c >= 65 ? String.fromCharCode(c) : '—'; }
  function stageActions(f, st) {
    var m = me().serial;
    if (!FUSION.isMember(f, m) || f.status !== 'open') return '';
    if (f.nextUs == null) return '<span class="auto">先約下一個出發點</span>';
    var a = function (act, label, cls) { return btn(act, label, ' data-id="' + st.id + '"', cls); };
    switch (st.status) {
      case 'proposed': return st.agreed.indexOf(m) < 0 ? a('sAgree', '同意', 'pri') : '<span class="auto">等其他人同意</span>';
      case 'agreed': return a('sClaim', '我來執行');
      case 'doing': return st.owner === m ? a('sSubmit', '做完了，交判') : '';
      case 'judging': return st.judges[m] == null ? a('sJudgeOk', '判完成', 'pri') + ' ' + a('sJudgeNo', '判未完成') : '<span class="auto">等其他人判</span>';
      case 'dispute': return (st.dispute[m] ? '<span class="auto">你投了' + (st.dispute[m] === 'done' ? '完成' : '退回') + '</span> ' : '') + a('sDisputeDone', '改判完成') + ' ' + a('sDisputeBack', '退回執行');
    }
    return '';
  }

  /* ---------- 規則草稿 ---------- */
  function rulesRole() { return roleOf(UI.rulesRole) || me(); }
  function worldRole() { return roleOf(UI.worldRole) || me(); }
  function editing() { return rulesRole() === me(); }
  function draft() {
    if (!UI.draft || UI.draftFor !== me().serial) { UI.draft = JSON.parse(JSON.stringify(DATA.currentRules(me()))); delete UI.draft.no; delete UI.draft.atUs; UI.draftFor = me().serial; }
    return UI.draft;
  }
  function draftDirty() { var c = DATA.currentRules(me()); var d = draft(); return JSON.stringify({ i: d.items, r: d.ratios, s: d.resources }) !== JSON.stringify({ i: c.items, r: c.ratios, s: c.resources }); }

  /* ---------- 通用表格 ---------- */
  function renderTable(sk, T) {
    var cols = T.cols, rows = T.rows();
    var letters = '<tr class="letters"><th class="rn"></th>' + cols.map(function (c, i) { return '<th class="' + (i === 0 ? 'fz' : '') + '">' + colLetter(i) + '</th>'; }).join('') + '</tr>';
    var names = '<tr class="names"><th class="rn"><span class="small">列</span></th>' + cols.map(function (c, i) { return '<th class="' + (i === 0 ? 'fz' : '') + (c.num ? ' n' : '') + '">' + esc(c.h) + '</th>'; }).join('') + '</tr>';
    var body = rows.map(function (r, i) {
      var id = T.rowId(r, i);
      var tds = cols.map(function (c, ci) { return '<td class="' + (ci === 0 ? 'fz' : '') + (c.num ? ' n' : '') + (c.wrap ? ' wrap' : '') + '" data-c="' + ci + '">' + c.v(r, i) + '</td>'; }).join('');
      var cls = (T.mine && T.mine(r) ? 'mine ' : '') + (T.cls ? T.cls(r) : '');
      return '<tr data-row data-id="' + esc(id) + '" data-i="' + (i + 1) + '" class="' + cls + '"><td class="rn">' + (i + 1) + '</td>' + tds + '</tr>';
    }).join('');
    if (T.add && (!T.add.when || T.add.when())) {
      var cells = T.add.cells();
      body += '<tr class="addrow" data-i="＊"><td class="rn"><span aria-hidden="true">＊</span></td>' + cols.map(function (c, ci) { return '<td class="' + (ci === 0 ? 'fz' : '') + (c.wrap ? ' wrap' : '') + '" data-c="' + ci + '">' + (cells[c.k] != null ? cells[c.k] : '<span class="auto">自動</span>') + '</td>'; }).join('') + '</tr>';
    }
    var empty = !rows.length && T.empty ? '<div class="empty">' + esc(T.empty) + '</div>' : '';
    return (T.title ? '<h3 class="tt">' + esc(T.title) + '</h3>' : '') + '<div class="wb"><table class="ws" data-sheet="' + sk + '" data-table="' + T.id + '"><thead>' + letters + names + '</thead><tbody>' + body + '</tbody></table>' + empty + '</div>' + (T.foot ? T.foot() : '');
  }
  function render() {
    if (!$('view-sheet') || $('view-sheet').hidden) { renderTabs(); return; }
    var sk = UI.sheet, Sh = SHEETS[sk];
    var scroll = $('view-sheet').scrollTop;
    var h = '<div class="sheet-head">' + (Sh.no ? '<span class="no">表 ' + Sh.no + '</span>' : '') + '<h2>' + esc(Sh.name) + '</h2></div><p class="sheet-desc">' + esc(Sh.desc) + '</p>';
    if (Sh.toolbar) h += '<div class="toolbar">' + Sh.toolbar() + '</div>';
    h += Sh.tables.map(function (T) { return renderTable(sk, T); }).join('');
    h += '<div class="msg" id="sheetMsg" hidden></div>';
    var nx = nextSheet();
    h += '<div class="nextbar">' + btn('nextSheet', '下一步 → ' + SHEETS[nx.sheet].name, '', 'pri') + '</div>';
    $('main').innerHTML = h;
    renderTabs();
    $('nameBox').textContent = Sh.no || Sh.name; $('nameBox').title = Sh.name; $('fxVal').textContent = '';
    $('backBtn').disabled = !UI.hist.length;
    if (UI.focus) focusRow(); else $('view-sheet').scrollTop = render.last === sk ? scroll : 0;
    render.last = sk;
  }
  function nextSheet() {
    if (UI.sheet === 'next') { var n = steps().next; return n ? { sheet: n.sheet, id: n.row } : { sheet: 'fusion', id: null }; }
    var i = ORDER.indexOf(UI.sheet);
    return { sheet: ORDER[(i + 1) % ORDER.length], id: null };
  }
  function renderTabs() {
    var world = APP.isWorld();
    $('tabs').innerHTML = '<a data-act="world"' + (world ? ' aria-current="page"' : '') + '><b>裡</b>裡世界</a><span class="sep" aria-hidden="true"></span>' +
      ORDER.map(function (k) { var Sh = SHEETS[k]; return '<a data-act="go" data-s="' + k + '"' + (!world && UI.sheet === k ? ' aria-current="page"' : '') + '>' + (Sh.no ? '<b>' + Sh.no + '</b>' : '') + esc(Sh.name) + '</a>'; }).join('');
    var cur = $('tabs').querySelector('[aria-current]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function focusRow() {
    var id = UI.focus; UI.focus = null;
    var tr = document.querySelector('.ws tr[data-row][data-id="' + CSS.escape(id) + '"]');
    if (!tr) { sheetMsg('你目前看不到這一列'); return; }
    tr.scrollIntoView({ block: 'center' });
    tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');
    var td = tr.querySelector('td[data-c="0"]'); if (td) selectCell(td);
  }
  function selectCell(td) {
    document.querySelectorAll('.ws td.sel').forEach(function (x) { x.classList.remove('sel'); });
    td.classList.add('sel');
    var table = td.closest('table'), sk = table.dataset.sheet, Sh = SHEETS[sk], tr = td.parentElement, ci = +td.dataset.c;
    var th = table.querySelectorAll('thead tr.names th')[ci + 1];
    $('nameBox').textContent = (Sh.no || Sh.name) + '!' + colLetter(ci) + tr.dataset.i;
    $('nameBox').title = Sh.name + '．' + (th ? th.textContent : '') + '．第 ' + tr.dataset.i + ' 列';
    var v = stripTags(td.innerHTML); $('fxVal').textContent = v; $('fxVal').title = v;
    UI.sel = { sk: sk, id: tr.dataset.id, ci: ci };
  }
  function sheetMsg(t) { var el = $('sheetMsg'); if (!el) { APP.msg(t); return; } el.textContent = t; el.hidden = false; setTimeout(function () { el.hidden = true; }, 3200); }

  /* ---------- 跳轉與返回 ---------- */
  function navigate(sheet, id) {
    if (!SHEETS[sheet]) return;
    UI.hist.push({ sheet: UI.sheet }); if (UI.hist.length > 60) UI.hist.shift();
    UI.sheet = sheet; UI.focus = id || null;
    // 跳到別人的世界那一列：先切到那個世界
    if (sheet === 'world' && id && id.indexOf(':') > 0) UI.worldRole = id.split(':')[0];
    if (sheet === 'rules' && id && id.indexOf(':') > 0) UI.rulesRole = id.split(':')[0];
    if (!APP.isWorld()) render(); else { APP.showTab('sheet'); }
  }
  function back() { var h = UI.hist.pop(); if (!h) return; UI.sheet = h.sheet; UI.focus = null; render(); }

  /* ---------- 動作（按鈕） ---------- */
  function run(fn, ok) {
    try { var r = fn(); APP.save(); render(); if (ok) sheetMsg(ok); return r; }
    catch (e) { sheetMsg(e.message); return null; }
  }
  var v = function (id) { var el = $(id); return el ? el.value : ''; };
  var ACT = {
    world: function () { APP.showTab('world'); },
    go: function (b) { navigate(b.dataset.s, null); },
    jump: function (b) { navigate(b.dataset.s, b.dataset.id || null); },
    nextSheet: function () { var n = nextSheet(); navigate(n.sheet, n.id); },
    resetAll: function () { UI.draft = null; APP.resetAll(); },
    // 角色
    addRole: function () { run(function () {
      var name = v('addRoleName').trim(); if (!name) throw new Error('先寫名字');
      var n = S().roles.length + 1, serial = String(n).padStart(11, '0');
      var base = DATA.defaultRoles()[0];
      var r = { serial: serial, name: name, color: '#586676', departUs: null, departDone: false, ruleVersions: [], problems: [], start: [0, 6], objects: JSON.parse(JSON.stringify(base.objects)), path: [[0, 6], [6, -2]], walk: JSON.parse(JSON.stringify(base.walk)) };
      r.rules = [];
      S().roles.push(DATA.cleanWorld(r));
    }, '新增了角色'); },
    // 難題
    addProblem: function () { run(function () { var p = DATA.addProblem(me(), v('addProblemText'), v('addProblemPrev') || null); UI.prevPick = null; UI.focus = p.id; }, '立了難題'); },
    recreate: function (b) { UI.prevPick = b.dataset.id; render(); var el = $('addProblemText'); if (el) el.focus(); },
    shelveProblem: function (b) { run(function () { var x = findProblem(b.dataset.id); if (!x || x.role !== me()) throw new Error('只能擱置自己的難題'); if (FUSION.openFor(S(), me().serial)) throw new Error('在融合裡的難題，退出融合才會擱置'); x.p.status = 'shelved'; me().departUs = null; me().departDone = false; APP.record('shelve', roleName(me().serial) + ' 主動擱置難題「' + x.p.text + '」。'); }, '擱置了'); },
    // 規則
    discardDraft: function () { UI.draft = null; render(); },
    addRule: function () { run(function () { var t = v('addRuleText').trim(); if (!t) throw new Error('先寫內容'); draft().items.push({ text: t, visible: v('addRuleVis') || 'all' }); }); },
    delRule: function (b) { draft().items.splice(+b.dataset.id, 1); render(); },
    addRes: function () { run(function () { var n = v('addResName').trim(); if (!n) throw new Error('先寫資源名稱'); draft().resources.push({ name: n, kcal: +v('addResKcal') || 0 }); }); },
    delRes: function (b) { draft().resources.splice(+b.dataset.id, 1); render(); },
    saveRules: function () { run(function () { var ver = DATA.saveRules(me(), draft()); UI.draft = null; UI.focus = me().serial + ':' + ver.no; }, '儲存成新版本'); },
    // 世界
    addObj: function () { run(function () {
      var r = worldRole(), name = v('addObjName').trim(); if (!name) throw new Error('先寫名稱');
      var id = 'o' + Date.now().toString(36);
      var o = { id: id, name: name, func: 'none', pos: [+v('addObjX') || 0, +v('addObjZ') || 0], look: v('addObjLook') || '山', parts: DATA.look(v('addObjLook') || '山', v('addObjColor') || '#8A8F96') };
      r.objects.push(o); APP.worldRefresh(r); UI.focus = r.serial + ':' + id;
    }, '新增了地標'); },
    delObj: function (b) { run(function () {
      var r = worldRole(), id = b.dataset.id;
      if (r.objects.length <= 1) throw new Error('至少留一個物件');
      r.objects = r.objects.filter(function (o) { return o.id !== id; });
      r.walk.circles = r.walk.circles.filter(function (c) { return c.object !== id; });
      r.walk.moves = r.walk.moves.filter(function (m) { return m.from !== id && m.to !== id; });
      APP.worldRefresh(r); if (r === me()) APP.walkChanged();
    }, '刪掉了，用到它的走法也一起刪'); },
    // 走法
    addCircle: function () { run(function () { me().walk.circles.push({ object: v('addCircleObj'), letter: v('addCircleLetter') || 'J' }); APP.walkChanged(); }); },
    delCircle: function (b) { run(function () { me().walk.circles.splice(+b.dataset.id, 1); APP.walkChanged(); }); },
    addMove: function () { run(function () { if (v('addMoveFrom') === v('addMoveTo')) throw new Error('從和走到要不同'); me().walk.moves.push({ from: v('addMoveFrom'), to: v('addMoveTo'), digit: v('addMoveDigit') || '1' }); APP.walkChanged(); }); },
    delMove: function (b) { run(function () { me().walk.moves.splice(+b.dataset.id, 1); APP.walkChanged(); }); },
    portal: function (b) { APP.openPortal(b.dataset.id); },
    portalIn: function () { var c = v('codeIn').trim().toUpperCase(); if (c) APP.openPortal(c); },
    // 出發點
    setDepart: function (b) { run(function () {
      var r = roleOf(b.dataset.id), s = +b.dataset.s;
      if (FUSION.openFor(S(), r.serial)) throw new Error(r.name + ' 在融合裡，出發點要在融合頁全員約定');
      if (s && !DATA.activeProblem(r)) throw new Error(r.name + ' 還沒立難題，先到難題頁立一個');
      r.departUs = s ? DATA.nowUs() + s * 1e6 + Math.floor(Math.random() * 1000) : null;
      r.departDone = false;
    }); },
    // 融合
    fProposeNext: function (b) { run(function () { FUSION.proposeNext(S(), fusionOf(b.dataset.id), me().serial, DATA.nowUs() + (+b.dataset.s) * 1e6 + Math.floor(Math.random() * 1000)); }); },
    fAgreeNext: function (b) { run(function () { FUSION.agreeNext(S(), fusionOf(b.dataset.id), me().serial); }); },
    fProposeStage: function (b) { run(function () { var st = FUSION.proposeStage(S(), fusionOf(b.dataset.id), me().serial, v('addStageText')); UI.focus = st.id; }); },
    fExit: function (b) { run(function () { FUSION.exit(S(), fusionOf(b.dataset.id), me().serial); }, '退出了'); },
    sAgree: function (b) { stageDo(b, function (f, st) { FUSION.agreeStage(S(), f, st.id, me().serial); }); },
    sClaim: function (b) { stageDo(b, function (f, st) { FUSION.claimStage(S(), f, st.id, me().serial); }); },
    sSubmit: function (b) { stageDo(b, function (f, st) { FUSION.submitStage(S(), f, st.id, me().serial); }); },
    sJudgeOk: function (b) { stageDo(b, function (f, st) { FUSION.judge(S(), f, st.id, me().serial, true); }); },
    sJudgeNo: function (b) { stageDo(b, function (f, st) { FUSION.judge(S(), f, st.id, me().serial, false); }); },
    sDisputeDone: function (b) { stageDo(b, function (f, st) { FUSION.disputeVote(S(), f, st.id, me().serial, 'done'); }); },
    sDisputeBack: function (b) { stageDo(b, function (f, st) { FUSION.disputeVote(S(), f, st.id, me().serial, 'back'); }); }
  };
  function stageDo(b, fn) { run(function () { var x = findStage(b.dataset.id); if (!x) throw new Error('沒有這個階段'); fn(x.f, x.st); }); }

  /* ---------- 編輯（輸入框、下拉） ---------- */
  var EDIT = {
    me: function (id) { APP.becomeMe(roleIdx(roleOf(id))); },
    roleName: function (id, val) { roleOf(id).name = val; },
    problemText: function (id, val) { var x = findProblem(id); if (x) x.p.text = val; },
    rulesRole: function (id, val) { UI.rulesRole = val; },
    worldRole: function (id, val) { UI.worldRole = val; },
    ruleText: function (id, val) { draft().items[+id].text = val; },
    ruleVis: function (id, val) { draft().items[+id].visible = val; },
    ratio: function (id, val) { draft().ratios[id] = +val; },
    resName: function (id, val) { draft().resources[+id].name = val; },
    resKcal: function (id, val) { draft().resources[+id].kcal = +val; },
    objName: function (id, val) { objEdit(id, function (o) { o.name = val; }); },
    objFunc: function (id, val) { objEdit(id, function (o) { o.func = val; }); },
    objX: function (id, val) { objEdit(id, function (o) { o.pos[0] = +val || 0; }); },
    objZ: function (id, val) { objEdit(id, function (o) { o.pos[1] = +val || 0; }); },
    objLook: function (id, val) { objEdit(id, function (o) { if (val) { o.look = val; o.parts = DATA.look(val, o.parts[0] ? o.parts[0].color : '#999999'); } else o.look = ''; }); },
    objColor: function (id, val) { objEdit(id, function (o) { if (o.look) o.parts = DATA.look(o.look, val); else if (o.parts[0]) o.parts[0].color = val; }); },
    circleObj: function (id, val) { me().walk.circles[+id].object = val; APP.walkChanged(); },
    circleLetter: function (id, val) { me().walk.circles[+id].letter = val; APP.walkChanged(); },
    moveFrom: function (id, val) { me().walk.moves[+id].from = val; APP.walkChanged(); },
    moveTo: function (id, val) { me().walk.moves[+id].to = val; APP.walkChanged(); },
    moveDigit: function (id, val) { me().walk.moves[+id].digit = val; APP.walkChanged(); },
    kcal: function (id, val) { FUSION.setCalories(S(), fusionOf(id), me().serial, +val); }
  };
  function objEdit(id, fn) { var r = worldRole(), o = r.objects.find(function (x) { return x.id === id; }); if (!o) return; fn(o); APP.worldRefresh(r, o.id); }

  var busy = false;
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (b && ACT[b.dataset.act]) { if (busy) return; busy = true; try { ACT[b.dataset.act](b); } finally { busy = false; } return; }
    var td = e.target.closest('.ws[data-sheet] tbody td'); if (!td || td.classList.contains('rn') || !td.parentElement.hasAttribute('data-row')) return;
    selectCell(td);
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (!t.dataset || !t.dataset.ed || !EDIT[t.dataset.ed] || busy) return;
    busy = true;
    try {
      try { EDIT[t.dataset.ed](t.dataset.id, t.value, t); APP.save(); }
      catch (err) { sheetMsg(err.message); return; }
      if (t.dataset.ed === 'me') return;   // becomeMe 已經重畫
      render();
    } finally { busy = false; }
  });
  $('backBtn').addEventListener('click', back);

  renderTabs();
  return { render: render, renderTabs: renderTabs, navigate: navigate, back: back, steps: steps, ui: UI, ORDER: ORDER, SHEETS: SHEETS };
})();

</script>
</body></html>
