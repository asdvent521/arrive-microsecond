<title>到達那微秒 v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* v9 表格世界：五張紙（A4 橫式等比例縮放）；最上面序號或密鑰框、去、骰子、五張紙的分頁、現在是誰 */
:root{
  --bg:#E6ECF1; --panel:#F7F9FB; --panel2:#EEF2F6; --ink:#16212D; --muted:#586676; --line:#C7D1DB; --grid:#D5DDE5;
  --brass:#A2731F; --brass-soft:#F1E4C8; --teal:#1C7A73; --teal-soft:#D5ECE9; --rose:#9C4450; --rose-soft:#F3DDE0; --blue:#2D5A86; --blue-soft:#DCE7F2;
  --green:#3F7A4A; --green-soft:#DCEBDD; --gold:#B8860B; --gold-soft:#F5E9C8;
  --hud:rgba(247,249,251,.9);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --r-s:6px; --r-m:12px; --tabs-h:44px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0D141B; --panel:#151F29; --panel2:#1B2733; --ink:#E2E9F0; --muted:#93A1B0; --line:#2B3947; --grid:#26333F;
  --brass:#D8A954; --brass-soft:#3A2E17; --teal:#43B5AA; --teal-soft:#15332F; --rose:#D57F8B; --rose-soft:#3A1E23; --blue:#7FA9D6; --blue-soft:#1C2C3D;
  --green:#7CC08A; --green-soft:#1C3322; --gold:#E0B64B; --gold-soft:#3A3014; --hud:rgba(21,31,41,.9); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D141B; --panel:#151F29; --panel2:#1B2733; --ink:#E2E9F0; --muted:#93A1B0; --line:#2B3947; --grid:#26333F;
  --brass:#D8A954; --brass-soft:#3A2E17; --teal:#43B5AA; --teal-soft:#15332F; --rose:#D57F8B; --rose-soft:#3A1E23; --blue:#7FA9D6; --blue-soft:#1C2C3D;
  --green:#7CC08A; --green-soft:#1C3322; --gold:#E0B64B; --gold-soft:#3A3014; --hud:rgba(21,31,41,.9); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body.in-house{overflow:hidden;height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem}
.btn{min-height:40px;padding:6px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:500;color:var(--ink)}
.btn.pri{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.sm{min-height:32px;padding:2px 10px;font-size:.84rem}
.btn.warn{color:var(--rose);border-color:var(--rose)}
.tag{display:inline-block;font-size:.74rem;padding:1px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.tag.bad{background:var(--rose-soft);color:var(--rose)} .tag.wait{background:var(--brass-soft);color:var(--brass)} .tag.off{background:var(--panel2);color:var(--muted)}
.view{position:absolute;inset:0;overflow:hidden}


/* ===== 表格世界：五張紙。每一頁就是紙本那張 A4 橫式（297×210），整張照畫面寬等比例縮放（1mm = 頁寬/297）；
   欄位、格線、底下的說明跟印出來的一樣；寫進去的是藍墨、簽名是紅字（系統簽）。紙永遠是淺的，桌面跟著深淺模式 ===== */
:root{--paper:#FDFCF8;--pen:#1F4A8A;--stamp:#A2392B;--gold:#9A6A12;--gold-ink:#FFFAF0;--hi:#FBF0D9;--rule:#999;--head:#EFECE4;--hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif}
#view-table{background:var(--bg);min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.tbar input[type=text]{width:9.5em;min-height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg)}
.tbar .btn{min-height:36px}
.tbar .who{flex:1 1 10em;min-width:0;font-size:.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.dice{padding:3px 8px;line-height:0;min-width:40px}
.btn.dice svg{display:block}
.btn.dice.roll svg{animation:roll .4s ease-out}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.ttabs{display:flex;gap:4px;flex-wrap:wrap}
.ttabs .tab{min-height:36px;padding:4px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel2);cursor:pointer;font-size:.9rem;white-space:nowrap;color:var(--ink)}
.ttabs .tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700}
#rotHint{display:none;font-size:.78rem;color:var(--muted);text-align:center;padding:2px 8px;background:var(--panel2);border-bottom:1px solid var(--line)}
@media (orientation:portrait) and (max-width:700px){#rotHint{display:block}}
.tutbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;padding:6px 10px;background:var(--brass-soft);border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 4px}
.stage{container-type:inline-size;min-width:680px;max-width:1400px;margin:0 auto}
.msg{margin:0 0 8px;padding:6px 10px;border-radius:var(--r-s);background:var(--blue-soft);font-size:.88rem;white-space:pre-line}
/* 按鈕：紙外面（最上面一列、教學列、彈出框）用一般大小；紙裡面照 mm */
.mini{font-family:var(--serif);font-size:.9rem;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink);border-radius:6px;padding:3px 12px;line-height:1.4;white-space:nowrap;cursor:pointer}
.mini.o{background:transparent;color:var(--gold)}
.mini.go{font-weight:700}
.mini:disabled{opacity:.45;cursor:default}
.lk{all:unset;cursor:pointer;color:var(--blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;font-weight:600}
.lk:disabled{cursor:default;opacity:.5}
a.lk{word-break:break-all}
.arr{font-family:var(--serif);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.arr input{width:20px;height:20px;margin:0}
/* 紙 */
.page{--mm:calc(100cqw / 297);--ink:#222;--muted:#555;--blue:#1F4A8A;--rose:#A2392B;--line:#BBB;width:100%;aspect-ratio:297/210;background:var(--paper);color:var(--ink);font-family:var(--serif);box-shadow:0 2px 14px rgba(0,0,0,.18);padding:calc(var(--mm)*9) calc(var(--mm)*10);display:flex;flex-direction:column;position:relative;color-scheme:light;margin-bottom:12px}
.page.grow{aspect-ratio:auto;min-height:calc(var(--mm)*210)}
.page header{display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--mm)*3);border-bottom:calc(var(--mm)*1.2) double var(--ink);padding-bottom:calc(var(--mm)*1.5)}
.page h1{margin:0;font-size:calc(var(--mm)*7);font-weight:900;letter-spacing:.3em;white-space:nowrap}
.page .sub{font-size:calc(var(--mm)*3.2);color:var(--muted);display:flex;align-items:center;gap:calc(var(--mm)*1.2);flex-wrap:wrap;justify-content:flex-end;text-align:right}
.page .fields{display:flex;gap:calc(var(--mm)*6) calc(var(--mm)*9);margin:calc(var(--mm)*3.5) 0 calc(var(--mm)*2.5);font-size:calc(var(--mm)*3.9);align-items:baseline;flex-wrap:wrap}
.page .fields>span{display:inline-flex;align-items:baseline;gap:calc(var(--mm)*1);flex-wrap:wrap}
.ln{display:inline-block;border-bottom:calc(var(--mm)*.3) solid var(--ink);min-width:calc(var(--mm)*38);padding:0 calc(var(--mm)*1.5);font-family:var(--hand);color:var(--pen);font-size:calc(var(--mm)*4.6);min-height:calc(var(--mm)*6.5);line-height:1.3;vertical-align:bottom}
.ln.s{min-width:calc(var(--mm)*22)}.ln.l{min-width:calc(var(--mm)*60)}
.ln input{border:0;background:transparent;width:calc(var(--mm)*35);font:inherit;color:inherit;padding:0;min-height:0}
.ln.s input{width:calc(var(--mm)*19)}.ln.l input{width:calc(var(--mm)*57)}
.ln .lk{color:var(--pen);font-weight:400;text-decoration-style:dotted}
.ln b{font-weight:400}
.page table{border-collapse:collapse;width:100%;table-layout:fixed}
.page th{border:calc(var(--mm)*.35) solid var(--ink);background:var(--head);font-size:calc(var(--mm)*3.35);font-weight:600;text-align:left;padding:calc(var(--mm)*1) calc(var(--mm)*1.5);line-height:1.25;vertical-align:bottom;color:var(--ink)}
.page th small{display:block;font-weight:400;color:var(--muted);font-size:calc(var(--mm)*2.65)}
.page td{border:calc(var(--mm)*.25) solid var(--rule);padding:calc(var(--mm)*.5) calc(var(--mm)*1.5);font-family:var(--hand);color:var(--pen);font-size:calc(var(--mm)*4.05);line-height:1.15;vertical-align:middle;overflow:hidden;overflow-wrap:anywhere}
.page td.r{text-align:right;font-variant-numeric:tabular-nums}
.page td small{display:block;font-size:calc(var(--mm)*2.8);color:#666;font-family:var(--serif);line-height:1.3}
.page td small.warn,.page .warn{color:var(--stamp)}
.page td.k{font-family:var(--serif);color:var(--ink);font-size:calc(var(--mm)*3.2);line-height:1.6}
.page td input.w,.page td input[type=text],.page td input[type=search]{border:0;background:transparent;width:100%;font:inherit;color:inherit;padding:0;min-height:0}
.page td input.w.r{text-align:right}
.page td input::placeholder{color:#C9C4B8}
.page td input[type=number],.page td input[type=time],.page td input[type=date],.page td input[type=url],.page td select,.page td textarea,.page td input.kc{border:0;border-bottom:calc(var(--mm)*.25) dotted var(--rule);background:transparent;font:inherit;color:var(--pen);padding:0 calc(var(--mm)*.5);min-height:0;max-width:100%}
.page td input[type=number]{width:calc(var(--mm)*14)} .page td input.kc{width:calc(var(--mm)*16)} .page td input[type=time]{width:calc(var(--mm)*22)} .page td input[type=date]{width:100%;font-size:calc(var(--mm)*3.2)}
.page td textarea{width:100%;min-height:calc(var(--mm)*11);font-size:calc(var(--mm)*3.6);line-height:1.3;resize:vertical}
.page td select{font-size:calc(var(--mm)*3.2);font-family:var(--serif)}
.page .fields input[type=number]{border:0;background:transparent;font:inherit;color:inherit;padding:0;width:calc(var(--mm)*16);min-height:0}
.page .fields input[type=search],.page .fields input[type=text]{border:0;background:transparent;font:inherit;color:inherit;padding:0;min-height:0;-webkit-appearance:none}
.page tr.future td{background:var(--hi)}
.page tr.flash>td{animation:rowflash 1.6s ease-out}
@keyframes rowflash{0%,40%{background:#F1E4C8}100%{background:transparent}}
.page .sig{color:var(--stamp)}
.page .dim{font-family:var(--serif);color:#999;font-size:calc(var(--mm)*2.9)}
.page td.dim{color:#999;font-family:var(--serif);font-size:calc(var(--mm)*2.9)}
.box{display:inline-block;width:calc(var(--mm)*3.2);height:calc(var(--mm)*3.2);border:calc(var(--mm)*.3) solid var(--ink);vertical-align:calc(var(--mm)*-.5);margin-right:calc(var(--mm)*.8);position:relative;background:transparent;padding:0;min-height:0}
.box.on::after{content:"✓";position:absolute;left:calc(var(--mm)*.1);top:calc(var(--mm)*-1.9);font-family:var(--hand);color:var(--pen);font-size:calc(var(--mm)*4.2)}
.box.x{background:linear-gradient(135deg,transparent 44%,var(--pen) 45%,var(--pen) 55%,transparent 56%)}
button.box{cursor:pointer}
.page .mini{font-size:calc(var(--mm)*2.9);border-width:calc(var(--mm)*.25);border-radius:calc(var(--mm)*1);padding:calc(var(--mm)*.4) calc(var(--mm)*1.8);line-height:1.3;margin:calc(var(--mm)*.3) calc(var(--mm)*.6) calc(var(--mm)*.3) 0}
.page .lk{font-family:var(--hand);font-weight:400}
.page .arr{font-size:calc(var(--mm)*2.8);color:var(--ink);gap:calc(var(--mm)*.8)}
.page .arr input{width:calc(var(--mm)*3.2);height:calc(var(--mm)*3.2)}
.page .cd{display:block;font-family:var(--serif);font-size:calc(var(--mm)*2.6);color:var(--gold)}
.page .lab{font-size:calc(var(--mm)*3.7);font-weight:600;margin:calc(var(--mm)*3) 0 calc(var(--mm)*1.2);letter-spacing:.1em}
.page .foot{margin:auto 0 0;padding-top:calc(var(--mm)*1.5);font-size:calc(var(--mm)*3);color:#444;line-height:1.55;border-top:calc(var(--mm)*.25) solid #BBB}
.page .foot b{color:#000}
.page .remind{font-size:calc(var(--mm)*3);color:var(--stamp);margin:0 0 calc(var(--mm)*1.5);line-height:1.4}
.page .remind .mini{margin:0 calc(var(--mm)*.6)}
.tagp{display:inline-block;font-family:var(--serif);font-size:calc(var(--mm)*2.6);line-height:1.5;padding:0 calc(var(--mm)*1.2);border-radius:999px;border:calc(var(--mm)*.25) solid var(--teal);color:var(--teal);white-space:nowrap;vertical-align:middle}
.tagp.bad{border-color:var(--stamp);color:var(--stamp)} .tagp.off{border-color:#AAA;color:#888}
/* 類別和標籤（補十九）：大類的鈕、小類的下拉、標籤格、怎麼對上的 */
.tagp.cat{border-color:var(--gold);color:#6B4F0C;background:var(--gold-soft)} .tagp.tag{border-color:#8A6E2F;color:#8A6E2F;margin-left:calc(var(--mm)*.6)}
.page .how{font-family:var(--serif);font-size:calc(var(--mm)*2.6);color:var(--blue);margin-right:calc(var(--mm)*1)}
.page .cats{display:flex;flex-wrap:wrap;gap:calc(var(--mm)*.6) calc(var(--mm)*.4);margin:0 0 calc(var(--mm)*1);align-items:center} .page .cats .mini{margin:0}
.page .cats.subs{padding-left:calc(var(--mm)*2);border-left:calc(var(--mm)*.6) solid var(--gold)}
.page .modes .mini{margin:0 calc(var(--mm)*.3) 0 0}
.page select.cs{font-size:calc(var(--mm)*2.7);max-width:calc(var(--mm)*34);font-family:var(--serif);border:0;border-bottom:calc(var(--mm)*.25) dotted var(--rule);background:transparent;color:var(--ink);padding:0;min-height:0;vertical-align:baseline}
.page input.tg{font-family:var(--serif);font-size:calc(var(--mm)*2.7);width:calc(var(--mm)*22);border:0;border-bottom:calc(var(--mm)*.25) dotted var(--rule);background:transparent;color:var(--pen);padding:0;min-height:0;vertical-align:baseline}
.page td small .cs,.page td small .tg{display:inline-block}
.page .cats .mini{min-height:32px;font-size:max(calc(var(--mm)*2.9),13px);padding:4px 6px;line-height:1.2}
.page .fields .foodline{width:100%;font-size:calc(var(--mm)*3.4);gap:calc(var(--mm)*.8)} .page .fields .foodline.warn{color:var(--stamp)} .page .fields .foodline.warn .mini{border-color:var(--stamp);color:var(--stamp)}
.page .fields .tagset{font-size:calc(var(--mm)*3);color:var(--muted)} .page .fields .tagset b{color:var(--pen);font-family:var(--hand);font-size:calc(var(--mm)*3.8)} .page .fields .tagset select.cs{font-size:calc(var(--mm)*3)}
/* 整條鏈：分支樹（補二十） */
.page .tree{position:relative;overflow-x:auto;overflow-y:hidden;padding:calc(var(--mm)*2) calc(var(--mm)*8) 30px}
.page .tsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.page .tsvg path{stroke:var(--teal);stroke-width:2.5;stroke-dasharray:6 4} .page .tsvg text{fill:var(--teal);font-family:var(--serif);font-size:11px}
.page .tn{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;position:relative;z-index:1}
.page .tk{display:flex;align-items:flex-start;gap:calc(var(--mm)*4)}
.page .tb{display:flex;flex-direction:column;align-items:center}
.page .te{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;border-left:2px solid #999;padding:4px 10px;font-family:var(--serif);font-size:max(calc(var(--mm)*2.8),12px);color:var(--muted);text-align:center;max-width:calc(var(--mm)*60)}
.page .te.lit{border-color:var(--teal);color:var(--teal);font-weight:600}
.page .tno{font-size:11px;color:var(--gold);letter-spacing:.1em}
.page .tcard{width:calc(var(--mm)*56);min-width:190px;max-width:260px;border:1px solid var(--ink);border-radius:8px;padding:8px 10px;background:#fff;text-align:left;font-family:var(--serif);font-size:max(calc(var(--mm)*3),13px);line-height:1.35;cursor:pointer;color:var(--ink)}
.page .tcard.lit{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 2px var(--teal-soft)}
.page .tcard.mine{border-width:2px;border-color:var(--pen)}
.page .tcard .th{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:2px} .page .tcard .th b{font-size:1.1em}
.page .tst{font-size:11px;padding:0 6px;border-radius:999px;border:1px solid var(--stamp);color:var(--stamp);white-space:nowrap} .page .tst.circle,.page .tst.slotted,.page .tst.done{border-color:var(--teal);color:var(--teal)} .page .tst.queued{border-color:#888;color:#666}
.page .tl{overflow-wrap:anywhere} .page .tcir{color:var(--teal);font-weight:600;margin-top:4px}
.page .tbt{margin-top:6px} .page .tbt .mini{margin:2px 4px 0 0;min-height:32px;font-size:13px}
.page .ttail{display:block;min-width:190px;max-width:260px;border:1.5px dashed #999;border-radius:8px;padding:8px 10px;background:transparent;font-family:var(--serif);font-size:13px;color:var(--ink);text-align:left;cursor:pointer;min-height:44px} .page .ttail small{display:block;color:var(--muted);font-size:11px;line-height:1.3} .page .ttail.dim{cursor:default}
.page .acts{display:flex;flex-wrap:wrap;gap:calc(var(--mm)*1.5);margin-top:calc(var(--mm)*3)}
.page .empty{padding:calc(var(--mm)*5) 0;color:#777;font-size:calc(var(--mm)*3.6)}
.page .help{padding:calc(var(--mm)*2) 0;max-width:none;font-size:calc(var(--mm)*3.3);line-height:1.6} .page .help h3{margin:calc(var(--mm)*3) 0 calc(var(--mm)*1);font-size:calc(var(--mm)*4)} .page .help p{margin:0}
.small.warn{color:var(--rose)}
.muted{color:var(--muted)}
/* 彈出框裡：選他的東西（一樣一行）、固定約的勾 */
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.opt.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt small{display:block;font-size:.8rem;color:var(--muted)}
.opt .pq{display:flex;align-items:center;gap:6px;white-space:nowrap}
.opt .pq b{min-width:1.4em;text-align:center}
.pop .arr.daily{display:flex;margin-top:10px;font-size:.92rem;white-space:normal}
/* 白光、彈出 */
.whiteflash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:60}
.whiteflash.go{animation:whiteflash .9s ease-out forwards}
@keyframes whiteflash{0%{opacity:1}100%{opacity:0}}
/* 日曆紙：一格一天；底色照磚（成交越多越亮）、沒成錯過小記號、還約著虛線框、蓋布、今天紅框、創角色以前空著 */
.page .fields .tot{font-size:calc(var(--mm)*3.3);color:var(--muted)}
.page .calp th{text-align:center;font-size:calc(var(--mm)*3.6);padding:calc(var(--mm)*1.2) 0}
.page .calp td{vertical-align:top;position:relative;padding:calc(var(--mm)*1) calc(var(--mm)*1.2);font-family:var(--serif);color:var(--ink);overflow:hidden}
.page .calp td.pad,.page .calp td.none{background:#F3F1EA}
.page .calp td.day::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 calc(var(--mm)*5) calc(var(--mm)*5) 0;border-color:transparent #DDD9CF transparent transparent}
.page .calp td.none::after{display:none}
.page .calp td.day[data-act]{cursor:pointer}
.page .calp td.day[data-act]:hover{box-shadow:inset 0 0 0 calc(var(--mm)*.4) var(--gold)}
