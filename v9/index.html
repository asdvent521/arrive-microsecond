<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>到達那微秒 v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
/* v9 表格世界：最上面序號框和隨機，上方切組裡的表，下方四組；手機轉橫每張表放得下 */
:root{
  --bg:#E6ECF1; --panel:#F7F9FB; --panel2:#EEF2F6; --ink:#16212D; --muted:#586676; --line:#C7D1DB; --grid:#D5DDE5;
  --brass:#A2731F; --brass-soft:#F1E4C8; --teal:#1C7A73; --teal-soft:#D5ECE9; --rose:#9C4450; --rose-soft:#F3DDE0; --blue:#2D5A86; --blue-soft:#DCE7F2;
  --green:#3F7A4A; --green-soft:#DCEBDD; --gold:#B8860B; --gold-soft:#F5E9C8;
  --hud:rgba(247,249,251,.9);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --r-s:6px; --r-m:12px; --tabs-h:44px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0D141B; --panel:#151F29; --panel2:#1B2733; --ink:#E2E9F0; --muted:#93A1B0; --line:#2B3947; --grid:#26333F;
  --brass:#D8A954; --brass-soft:#3A2E17; --teal:#43B5AA; --teal-soft:#15332F; --rose:#D57F8B; --rose-soft:#3A1E23; --blue:#7FA9D6; --blue-soft:#1C2C3D;
  --green:#7CC08A; --green-soft:#1C3322; --gold:#E0B64B; --gold-soft:#3A3014; --hud:rgba(21,31,41,.9); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D141B; --panel:#151F29; --panel2:#1B2733; --ink:#E2E9F0; --muted:#93A1B0; --line:#2B3947; --grid:#26333F;
  --brass:#D8A954; --brass-soft:#3A2E17; --teal:#43B5AA; --teal-soft:#15332F; --rose:#D57F8B; --rose-soft:#3A1E23; --blue:#7FA9D6; --blue-soft:#1C2C3D;
  --green:#7CC08A; --green-soft:#1C3322; --gold:#E0B64B; --gold-soft:#3A3014; --hud:rgba(21,31,41,.9); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem}
.btn{min-height:40px;padding:6px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:500;color:var(--ink)}
.btn.pri{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.sm{min-height:32px;padding:2px 10px;font-size:.84rem}
.btn.warn{color:var(--rose);border-color:var(--rose)}
.tag{display:inline-block;font-size:.74rem;padding:1px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.tag.bad{background:var(--rose-soft);color:var(--rose)} .tag.wait{background:var(--brass-soft);color:var(--brass)} .tag.off{background:var(--panel2);color:var(--muted)}
.view{position:absolute;inset:0;overflow:hidden}


/* ===== 表格世界 ===== */
#view-table{display:flex;flex-direction:column;background:var(--bg)}
.tbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.tbar input[type=text]{width:8.5em;min-height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);font-variant-numeric:tabular-nums}
.tbar .btn{min-height:36px}
.tbar .who{flex:1 1 12em;min-width:0;font-size:.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#rotHint{display:none;flex:none;font-size:.78rem;color:var(--muted);text-align:center;padding:2px 8px;background:var(--panel2);border-bottom:1px solid var(--line)}
@media (orientation:portrait) and (max-width:700px){#rotHint{display:block}}
.tutbar{flex:none;display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 10px;background:var(--brass-soft);border-bottom:1px solid var(--line)}
.ttabs{flex:none;display:flex;gap:4px;overflow-x:auto;padding:6px 8px 0;background:var(--panel2);border-bottom:1px solid var(--line);scrollbar-width:thin}
.ttabs .tab{flex:none;min-height:36px;padding:4px 12px;border:1px solid transparent;border-bottom:0;border-radius:var(--r-s) var(--r-s) 0 0;background:transparent;cursor:pointer;font-size:.9rem;white-space:nowrap}
.ttabs .tab.on{background:var(--panel);border-color:var(--line);font-weight:700}
#tmain{flex:1;min-height:0;overflow:auto;padding:0 6px 12px}
.tgroups{flex:none;display:flex;background:var(--panel2);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:4px}
.tgroups .grp{flex:1;min-height:40px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);cursor:pointer;font-weight:500}
.tgroups .grp.on{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700}
.msg{margin:8px 2px 0;padding:6px 10px;border-radius:var(--r-s);background:var(--blue-soft);font-size:.88rem;white-space:pre-line}
.sec{font-family:var(--serif);font-size:.98rem;margin:12px 2px 6px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 2px}
.ctl input[type=search]{flex:1 1 12em;min-width:8em;max-width:24em;min-height:34px;padding:3px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg)}
.ctl select{min-height:32px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg)}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.lkb{border:0;background:none;color:var(--blue);text-decoration:underline;padding:2px 0;min-height:28px}
.energy-box{margin:8px 2px;max-width:24em}
.energy{height:10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:3px 0}
.energy i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--brass));transition:width .4s}
/* 表：寬度跟著畫面，字可以換行；手機轉橫（約 780）放得下，直放時左右滑 */
.ws{border-collapse:separate;border-spacing:0;font-size:.84rem;width:100%;margin-top:6px}
.ws th,.ws td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:5px 6px;text-align:left;vertical-align:top;background:var(--panel);white-space:normal;overflow-wrap:anywhere}
.ws thead th{position:sticky;top:0;z-index:3;background:var(--panel2);font-weight:600;font-size:.8rem;white-space:nowrap}
.ws .fz{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
.ws thead .fz{z-index:4}
.ws tr.flash > td{animation:rowflash 1.6s ease-out}
@keyframes rowflash{0%,40%{background:var(--brass-soft)}100%{background:var(--panel)}}
.ws tr.addrow > td{background:var(--blue-soft)}
.ws tr.mine > td.fz{box-shadow:inset 3px 0 0 var(--teal),1px 0 0 var(--line)}
.ws tr.next > td{background:var(--brass-soft)}
.ws tr.day > td{background:var(--panel2)}
.ws input[type=text],.ws input[type=number],.ws input[type=url],.ws input[type=date],.ws select,.ws textarea{min-height:30px;padding:2px 5px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);max-width:100%;font-size:.84rem}
.ws input[type=text]{width:9em} .ws input.nm{width:7.5em} .ws input.kd{width:6em} .ws input.kc{width:4.2em} .ws input.mg{width:5.4em} .ws input.wide{width:16em} .ws textarea{width:14em;min-height:46px}
.ws input[type=date]{width:9.2em}
.ws input[type=checkbox]{width:20px;height:20px;vertical-align:middle}
.ws hr{border:0;border-top:1px dashed var(--grid);margin:4px 0}
.ws .btn{white-space:nowrap}
.chk{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin:1px 6px 1px 0}
.when{white-space:nowrap;line-height:1.35}
.pick{margin:2px 0 4px;min-width:7.5em}
.pick .pk{display:flex;justify-content:space-between;gap:6px}
.pick .pq{display:flex;align-items:center;gap:6px}
.pick .pq b{min-width:1.4em;text-align:center}
.stk{display:flex;gap:4px;align-items:center;margin-top:2px}
.small.warn{color:var(--rose)}
.lk{all:unset;cursor:pointer;color:var(--blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;font-weight:600}
a.lk{word-break:break-all}
.empty{padding:10px 4px;color:var(--muted);font-size:.88rem}
.help{padding:8px 6px;max-width:44em;font-size:.92rem} .help h3{font-family:var(--serif);margin:14px 0 4px} .help p{margin:0 0 6px}
/* 白光、彈出 */
.whiteflash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:60}
.whiteflash.go{animation:whiteflash .9s ease-out forwards}
@keyframes whiteflash{0%{opacity:1}100%{opacity:0}}
.pop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:16px}
.pop .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);max-width:30em;width:100%;max-height:calc(100% - 16px);display:flex;flex-direction:column;padding:12px 14px;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.pop h3{font-family:var(--serif);margin:0;font-size:1.02rem}
.pop .body{white-space:pre-line;overflow:auto;font-size:.92rem;min-height:0}
.pop .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main id="view-table" class="view">
  <div class="tbar"><input type="text" id="serialIn" placeholder="序號，例如 J2" aria-label="序號" autocomplete="off" inputmode="text"><button type="button" class="btn sm pri" data-act="serialGo" id="serialGo">去</button><button type="button" class="btn sm" data-act="random" id="randomBtn">隨機</button><span class="who" id="tother"></span></div>
  <div id="rotHint">轉橫看整張表</div>
  <div class="tutbar" id="tutbar" hidden></div>
  <nav class="ttabs" id="ttabs" aria-label="表"></nav>
  <div id="tmain"></div>
  <nav class="tgroups" id="tgroups" aria-label="組"></nav>
</main>
<div class="whiteflash" id="flash"></div>
<div class="pop" id="pop" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="popTitle"><h3 id="popTitle"></h3><div class="body" id="popBody"></div><div class="btns" id="popBtns"></div></div></div>
<script>
/* ===== v8 平台核心：規則與資料，不碰畫面 =====
 * 純函式、node 可測。世界只能是資料。
 * 一人一角色、每天一版（明天起）、資源分可換／已保留、收點就選好東西、那一微秒兩兩成交、保留與兌現、不玩了。
 * 序號、走法解碼、外觀形體、世界檢查沿用 v5。
 */
var CORE = (function () {
  'use strict';
  /* ---------- 功能點：平台的清單 ---------- */
  var FUNCS = {
    rule:     { label: '規則', defaultLook: '屋' },
    resource: { label: '資源', defaultLook: '市集' },
    goal:     { label: '終點', defaultLook: '台' },
    role:     { label: '角色', defaultLook: '碑' },
    points:   { label: '點數', defaultLook: '帳房', selfOnly: true },
    none:     { label: '地標', defaultLook: '—' }
  };
  /* ---------- 角色序號：11 位數，開頭幾個 0 就用第幾個字母 ---------- */
  function abbrev(serial) {
    var m = /^(0*)(\d*)$/.exec(serial);
    if (!m || serial.length !== 11) return null;
    var z = m[1].length;
    if (z === 0) return serial;
    if (z === 11) return null;                 // 全 0 不是角色
    return String.fromCharCode(64 + z) + m[2];
  }
  function expand(code) {
    if (/^\d{11}$/.test(code) && code[0] !== '0') return code;
    var m = /^([A-J])(\d+)$/.exec(String(code).toUpperCase());
    if (!m) return null;
    var z = m[1].charCodeAt(0) - 64;
    if (z + m[2].length !== 11 || m[2][0] === '0') return null;
    return '0'.repeat(z) + m[2];
  }
  // 字母告訴你後面有幾位數
  function digitsAfter(letter) { return 11 - (letter.charCodeAt(0) - 64); }
  var SHAPES = { box: '方塊', cylinder: '圓柱', sphere: '球', cone: '錐' };

  /* ---------- 預設外觀（都是基本形體的組合；主人隨時可改） ---------- */
  var LOOKS = {
    '屋': function (c) { return [
      { shape: 'box', size: [3, 2.2, 3], color: c, offset: [0, 1.1, 0] },
      { shape: 'cone', size: [4, 1.5, 4], color: '#7A4B32', offset: [0, 2.95, 0] } ]; },
    '碑': function (c) { return [
      { shape: 'box', size: [1.4, 3.4, 0.5], color: c, offset: [0, 1.7, 0] },
      { shape: 'box', size: [2.2, 0.4, 1.2], color: '#8A8F96', offset: [0, 0.2, 0] } ]; },
    '台': function (c) { return [
      { shape: 'cylinder', size: [3.2, 0.5, 3.2], color: c, offset: [0, 0.25, 0] },
      { shape: 'cylinder', size: [2.2, 0.5, 2.2], color: c, offset: [0, 0.75, 0] } ]; },
    '殿': function (c) { return [
      { shape: 'box', size: [4, 0.6, 4], color: '#8A8F96', offset: [0, 0.3, 0] },
      { shape: 'cylinder', size: [0.5, 3, 0.5], color: c, offset: [-1.4, 2.1, -1.4] },
      { shape: 'cylinder', size: [0.5, 3, 0.5], color: c, offset: [1.4, 2.1, -1.4] },
      { shape: 'cylinder', size: [0.5, 3, 0.5], color: c, offset: [-1.4, 2.1, 1.4] },
      { shape: 'cylinder', size: [0.5, 3, 0.5], color: c, offset: [1.4, 2.1, 1.4] },
      { shape: 'box', size: [4.2, 0.5, 4.2], color: c, offset: [0, 3.85, 0] } ]; },
    '工坊': function (c) { return [
      { shape: 'box', size: [3.6, 1.8, 2.6], color: c, offset: [0, 0.9, 0] },
      { shape: 'cylinder', size: [0.5, 1.6, 0.5], color: '#5C6670', offset: [1.2, 2.6, -0.6] } ]; },
    '樹': function (c) { return [
      { shape: 'cylinder', size: [0.6, 2, 0.6], color: '#7A4B32', offset: [0, 1, 0] },
      { shape: 'sphere', size: [3, 3, 3], color: c, offset: [0, 3.2, 0] } ]; },
    '井': function (c) { return [
      { shape: 'cylinder', size: [2.2, 1, 2.2], color: c, offset: [0, 0.5, 0] },
      { shape: 'cylinder', size: [1.4, 1.1, 1.4], color: '#1E2A36', offset: [0, 0.56, 0] } ]; },
    '噴泉': function (c) { return [
      { shape: 'cylinder', size: [3.4, 0.6, 3.4], color: c, offset: [0, 0.3, 0] },
      { shape: 'cylinder', size: [0.6, 1.6, 0.6], color: c, offset: [0, 1.4, 0] },
      { shape: 'sphere', size: [1.2, 1.2, 1.2], color: '#9CC9E8', offset: [0, 2.6, 0] } ]; },
    '山': function (c) { return [
      { shape: 'cone', size: [6, 5, 6], color: c, offset: [0, 2.5, 0] } ]; },
    '市集': function (c) { return [
      { shape: 'box', size: [4, 1.6, 2.6], color: c, offset: [0, 0.8, 0] },
      { shape: 'box', size: [4.6, 0.3, 3.2], color: '#B23A48', offset: [0, 1.85, 0] },
      { shape: 'cylinder', size: [0.3, 1.8, 0.3], color: '#7A4B32', offset: [-2, 0.9, 1.4] },
      { shape: 'cylinder', size: [0.3, 1.8, 0.3], color: '#7A4B32', offset: [2, 0.9, 1.4] } ]; },
    '塔': function (c) { return [
      { shape: 'cylinder', size: [2, 4, 2], color: c, offset: [0, 2, 0] },
      { shape: 'cone', size: [2.4, 1.6, 2.4], color: '#5C6670', offset: [0, 4.8, 0] } ]; }
  };
  function look(name, color) { return LOOKS[name] ? LOOKS[name](color) : LOOKS['屋'](color); }

  // 物件的地面半徑：用來判斷「靠近」「到達」「繞圈」
  function radiusOf(obj) {
    var r = 0.8;
    (obj.parts || []).forEach(function (p) {
      var o = p.offset || [0, 0, 0];
      var rr = Math.hypot(o[0], o[2]) + Math.max(p.size[0], p.size[2]) / 2;
      if (rr > r) r = rr;
    });
    return r;
  }
  /* ---------- 走法解碼：畫面層丟事件進來，這裡算出走出來的代號 ---------- */
  // 事件：{type:'circle', object, count}（離開物件時送一次）、{type:'arrive', object}
  function Decoder(walk) {
    this.walk = walk;
    this.reset();
  }
  Decoder.prototype.reset = function () {
    this.letter = null; this.digits = ''; this.lastAt = null; this.done = null;
  };
  Decoder.prototype.code = function () {
    return (this.letter || '') + this.digits;
  };
  // 還要走幾個數字：有字母看字母，沒字母就是 11 位
  Decoder.prototype.need = function () {
    return (this.letter ? digitsAfter(this.letter) : 11) - this.digits.length;
  };
  Decoder.prototype.feed = function (ev) {
    if (this.done) return { type: 'ignored' };
    if (ev.type === 'circle') {
      var rule = this.walk.circles.find(function (r) { return r.object === ev.object; });
      if (!rule || ev.count < 1) return { type: 'ignored' };
      var c = rule.letter.charCodeAt(0) - (ev.count - 1);   // 一圈 J、兩圈 I……
      if (c < 65) return { type: 'ignored' };
      this.letter = String.fromCharCode(c); this.digits = ''; this.lastAt = ev.object;   // 繞完那棟就算人在那裡
      return { type: 'letter', letter: this.letter, need: this.need() };
    }
    if (ev.type === 'arrive') {
      var from = this.lastAt; this.lastAt = ev.object;
      if (!from || from === ev.object) return { type: 'ignored' };
      var mv = this.walk.moves.find(function (r) { return r.from === from && r.to === ev.object; });
      if (!mv) return { type: 'ignored' };
      if (!this.letter && !this.digits && mv.digit === '0') return { type: 'ignored' };   // 11 位數不能 0 開頭
      this.digits += mv.digit;
      if (this.need() === 0) { this.done = this.code(); return { type: 'done', code: this.done }; }
      return { type: 'digit', digit: mv.digit, need: this.need() };
    }
    return { type: 'ignored' };
  };

  /* ---------- 路線說明：用自己的走法，怎麼走出某個代號 ---------- */
  // 回傳 {steps:[文字…]}，走法表湊不出來就回傳 {missing:'缺什麼'}
  function route(walk, objects, code) {
    var serial = expand(code);
    if (!serial) return { missing: code + ' 不是代號' };
    var ab = abbrev(serial);
    var name = function (id) { var o = objects.find(function (x) { return x.id === id; }); return o ? o.name : id; };
    var steps = [], letter = /^[A-J]/.test(ab) ? ab[0] : null, digits = letter ? ab.slice(1) : ab, at = null;
    if (letter) {
      var best = null;
      walk.circles.forEach(function (c) {
        var n = c.letter.charCodeAt(0) - letter.charCodeAt(0) + 1;
        if (n >= 1 && (!best || n < best.n)) best = { c: c, n: n };
      });
      if (!best) return { missing: '走法表裡沒有物件能繞出 ' + letter };
      steps.push('繞' + name(best.c.object) + (best.n === 1 ? '一圈' : ' ' + best.n + ' 圈') + '（' + letter + '）');
      at = best.c.object;   // 繞完那棟就是起點
    }
    for (var i = 0; i < digits.length; i++) {
      var d = digits[i];
      var mv = walk.moves.find(function (m) { return m.digit === d && m.from === at; }) ||
               walk.moves.find(function (m) { return m.digit === d; });
      if (!mv) return { missing: '走法表裡沒有哪一段路是 ' + d };
      if (mv.from !== at) steps.push('走到' + name(mv.from));
      steps.push('再走到' + name(mv.to) + '（' + d + '）');
      at = mv.to;
    }
    return { steps: steps, code: ab };
  }
  function bad(msg) { throw new Error(msg); }
  function str(v, max, what) { if (typeof v !== 'string') bad(what + ' 不是文字'); if (v.length > max) bad(what + ' 太長'); return v; }

    if (UI.focus) { var tr = document.querySelector('#tmain tr[data-row][data-id="' + CSS.escape(UI.focus) + '"]'); UI.focus = null; if (tr) { tr.scrollIntoView({ block: 'center' }); tr.classList.add('flash'); } }
  }
  function msg(t) { UI.msg = t || ''; var el = $('tmsg'); if (el) { el.textContent = UI.msg; el.hidden = !UI.msg; } }
  // 換頁：自己的表
  function tab(sheet, id) {
    if (UI.other) { if (OTHER.indexOf(sheet) >= 0) { UI.osheet = sheet; if (sheet === 'rules' && UI.other === APP.GUIDE) APP.tutEvent('sawGuideRules'); render(); return; } UI.other = null; }
    var g = GROUPS.find(function (x) { return x.sheets.indexOf(sheet) >= 0; }); if (!g) return;
    UI.group = g.k; UI.sheet = sheet; UI.focus = id || null; UI.msg = ''; render();
  }
  // 到他的表格世界（how：從哪裡來的，教學用）
  function visit(serial, sheet, how) {
    var r = roleOf(serial); if (!r) { msg('找不到這個序號'); return false; }
    if (r === me()) { UI.other = null; tab(sheet && SHEETS.indexOf(sheet) >= 0 ? sheet : 'role'); return true; }
    UI.other = serial; UI.osheet = OTHER.indexOf(sheet) >= 0 ? sheet : 'role'; UI.msg = '';
    if (serial === APP.GUIDE && (how === 'serial' || how === 'notice')) APP.tutEvent('foundGuide');
    if (serial === APP.GUIDE && UI.osheet === 'rules') APP.tutEvent('sawGuideRules');
    render(); return true;
  }
  function home() { UI.other = null; render(); }

  /* ---------- 彈出：成交結果、你不在的時候 ---------- */
  function pop(title, body, buttons) {
    $('popTitle').textContent = title; $('popBody').textContent = body;
    $('popBtns').innerHTML = (buttons || [{ label: '好', pri: true }]).map(function (b, i) { return '<button type="button" class="btn' + (b.pri ? ' pri' : '') + '" data-pop="' + i + '">' + esc(b.label) + '</button>'; }).join('');
    $('pop').hidden = false; $('popBody').scrollTop = 0;
    $('popBtns').querySelectorAll('[data-pop]').forEach(function (el) { el.onclick = function () { $('pop').hidden = true; var b = (buttons || [])[+el.dataset.pop]; if (b && b.fn) b.fn(); }; });
  }
  function flash() { var el = $('flash'); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }

  /* ---------- 動作 ---------- */
  function run(fn, ok) { var r = APP.run(fn, ok); msg(r.msg); return r; }
  var val = function (id) { var el = $(id); return el ? el.value : ''; };
  function wantEdit(b, delta) { var slot = CORE.slotOf(S(), b.dataset.slot).slot, ids = CORE.wantsOf(slot, me().serial, b.dataset.other).slice(); if (delta > 0) ids.push(b.dataset.res); else { var i = ids.indexOf(b.dataset.res); if (i >= 0) ids.splice(i, 1); } run(function () { CORE.setWants(S(), slot.id, me().serial, b.dataset.other, ids); }); }
  function tmr() { return CORE.tomorrow(S(), me().serial, now()); }
  function createMe(skip) {
    var r = run(function () { APP.createPlayer({ name: val('cName').trim(), dailyPoints: val('cDaily'), firstItem: { name: val('cItem').trim(), price: +val('cPrice') || 0, qty: Math.max(0, Math.floor(+val('cQty') || 0)) } }, skip); }, skip ? '角色建好了。跳過教學' : '角色建好了。教學開始：按最上面的「隨機」');
    if (r.ok) { UI.group = 'today'; UI.sheet = 'today'; UI.other = null; render(); msg(r.msg); }
  }
  function goSerial() {
    var code = val('serialIn').trim(); if (!code) { msg('先輸入序號，例如 J2'); return; }
    var r = CORE.findRole(S(), code); if (!r) { msg('找不到序號 ' + code); return; }
    visit(r.serial, 'role', 'serial');
  }
  var ACT = {
    go: function (b) { var g = GROUPS.find(function (x) { return x.k === b.dataset.g; }); UI.other = null; tab(UI.group === g.k && g.sheets.indexOf(UI.sheet) >= 0 ? UI.sheet : g.sheets[0]); },
    tab: function (b) { if (b.dataset.g) UI.group = b.dataset.g; tab(b.dataset.s, b.dataset.id || null); },
    visit: function (b) { visit(b.dataset.id, b.dataset.s || 'role', b.closest('[data-sheet="notices"]') ? 'notice' : 'link'); },
    home: home,
    serialGo: goSerial,
    random: function () { var r = CORE.randomRole(S(), me().serial); if (!r) { msg('沒有別人'); return; } APP.tutEvent('random'); visit(r.serial, 'role', 'random'); },
    defs: function (b) { UI.defsOf = b.dataset.id; if (UI.other) UI.osheet = 'defs'; else { UI.group = 'mine'; UI.sheet = 'defs'; } UI.focus = 'd:' + b.dataset.res; render(); },
    backDefs: function () { if (UI.other) UI.osheet = 'resources'; else UI.sheet = 'resources'; render(); },
    search: function () { UI.kw = val('kwIn').trim(); render(); },
    clearKw: function () { UI.kw = ''; render(); },
    findMode: function (b) { UI.findMode = b.dataset.v; render(); },
    noticeMode: function (b) { UI.noticeMode = b.dataset.v; render(); },
    post: function () { var give = [].slice.call(document.querySelectorAll('#tmain [data-give]')).filter(function (x) { return x.checked; }).map(function (x) { return x.dataset.give; }); var u = val('ntUntil'); run(function () { CORE.postNotice(S(), me().serial, { need: val('ntNeed'), kind: val('ntKind'), give: give, cap: val('ntCap'), untilDay: u ? CORE.dayNum(new Date(u + 'T12:00:00').getTime() * 1000) : null }, now()); }, '公告掛上去了'); },
    unpost: function (b) { run(function () { CORE.removeNotice(S(), me().serial, b.dataset.id); }, '撤掉了'); },
    book: function (b) { var box = $('arr_' + b.dataset.id), arrive = !box || box.checked; var r = run(function () { return CORE.book(S(), me().serial, b.dataset.id, now(), arrive); }, arrive ? '約好了，到達也確認了。到「我預約的」選要換他的什麼' : '約好了，還沒確認到達：到「我預約的」勾到達'); if (r.ok) { UI.other = null; tab('booked', b.dataset.id); msg(r.msg); } },
    cancelBook: function (b) { run(function () { CORE.cancelBooking(S(), me().serial, b.dataset.id); }, '取消預約了'); },
    wantAdd: function (b) { wantEdit(b, 1); },
    wantSub: function (b) { wantEdit(b, -1); },
    addSlot: function () { run(function () { var min = +val('addSlotMin'); if (!(min >= 1)) throw new Error('幾分鐘後要至少 1'); var s = CORE.addSlot(S(), me().serial, now() + min * 60e6 + Math.floor(Math.random() * 1000), val('addSlotCap'), val('addSlotMax'), now(), $('addSlotTogether') && $('addSlotTogether').checked); UI.focus = s.id; }, '開了時段'); },
    delSlot: function (b) { run(function () { CORE.deleteSlot(S(), me().serial, b.dataset.id, now()); }, '刪了時段'); },
    quit: function (b) { var bl = CORE.quitBlockers(S(), b.dataset.id, now()); pop('不玩了', '刪掉 ' + me().name + '。' + (bl.length ? '還有 ' + bl.length + ' 筆你的點沒換，會作廢；單機版持有人都在本機，視為同意。' : '沒有人拿著你的點。'), [{ label: '確定不玩了', fn: function () { run(function () { APP.quit(b.dataset.id); }, '角色刪掉了'); } }, { label: '不要', pri: true }]); },
    create: function () { createMe(false); }, createSkip: function () { createMe(true); },
    accept: function (b) { run(function () { CORE.accept(S(), me().serial, b.dataset.id, now()); }, '接受了他的家規'); },
    addUse: function () { run(function () { var t = val('addUse').trim(); if (!t) throw new Error('先寫內容'); tmr().rules.uses.push(t); }, '加了，明天起'); },
    delUse: function (b) { run(function () { tmr().rules.uses.splice(+b.dataset.id, 1); }, '刪了，明天起'); },
    addCond: function () { run(function () { tmr().rules.conditions.push({ field: val('addCondField'), op: val('addCondOp'), value: +val('addCondValue') || 0 }); }, '加了，明天起'); },
    delCond: function (b) { run(function () { tmr().rules.conditions.splice(+b.dataset.id, 1); }, '刪了，明天起'); },
    addRes: function () { run(function () { CORE.addResource(S(), me().serial, { name: val('addResName'), def: val('addResDef'), price: val('addResPrice'), keepDays: val('addResKeep') }, now()); }, '上架了，明天起生效；可換的數量現在就能補'); },
    delRes: function (b) { run(function () { CORE.removeResource(S(), me().serial, b.dataset.id, now()); }, '明天起下架；已保留的照舊'); },
    stock: function (b) { var k = Math.floor(+val('stockN_' + b.dataset.id)) || 1; run(function () { CORE.restock(S(), me().serial, b.dataset.id, +b.dataset.n * k); }, +b.dataset.n > 0 ? '補了 ' + k + ' 份' : '減了 ' + k + ' 份'); },
    redeem: function (b) { run(function () { CORE.redeem(S(), me().serial, b.dataset.id, now()); }, '換到了'); },
    resetAll: function () { pop('全部還原成預設', '所有資料都會清掉，從創角色開始。', [{ label: '還原', fn: function () { APP.resetAll(); UI.other = null; UI.group = 'mine'; UI.sheet = 'role'; UI.msg = ''; render(); } }, { label: '不要', pri: true }]); },
    tutSkip: function () { APP.tutSkip(); msg('跳過了教學。想只收不給，記得要有 0 點的空物件。'); }
  };
  var EDIT = {
    me: function (id, v) { APP.becomeMe(+v); },
    kind: function (id, v) { UI.kind = v; },
    daily: function (id, v) { CORE.setDailyPoints(S(), me().serial, v, now()); },
    contact: function (id, v) { CORE.setContact(S(), me().serial, v); },
    useText: function (id, v) { tmr().rules.uses[+id] = v; },
    condField: function (id, v) { tmr().rules.conditions[+id].field = v; },
    condOp: function (id, v) { tmr().rules.conditions[+id].op = v; },
    condValue: function (id, v) { tmr().rules.conditions[+id].value = +v || 0; },
    switch: function (id, v, el) { tmr().rules[id] = !!el.checked; },
    village: function (id, v) { tmr().rules.village = v; },
    site: function (id, v) { CORE.setSite(S(), me().serial, v, now()); },
    resName: function (id, v) { CORE.setResource(S(), me().serial, id, { name: v }, now()); },
    resDef: function (id, v) { CORE.setResource(S(), me().serial, id, { def: v }, now()); },
    resPrice: function (id, v) { CORE.setResource(S(), me().serial, id, { price: v }, now()); },
    resKeep: function (id, v) { CORE.setResource(S(), me().serial, id, { keepDays: v }, now()); },
    present: function (id, v, el) { CORE.setPresent(S(), me().serial, id, el.checked); },
    maxGive: function (id, v) { var x = CORE.slotOf(S(), id); if (x) CORE.setMaxGive(S(), x.slot, me().serial, v); }
  };
  var busy = false;
  $('view-table').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || !ACT[b.dataset.act] || busy || b.disabled) return;
    busy = true; try { ACT[b.dataset.act](b); } finally { busy = false; }
  });
  $('view-table').addEventListener('change', function (e) {
    var t = e.target; if (!t.dataset || !t.dataset.ed || !EDIT[t.dataset.ed] || busy) return;
    busy = true;
    try { var okMsg = t.dataset.ed === 'present' ? (t.checked ? '確認到達了' : '取消到達了') : ''; try { EDIT[t.dataset.ed](t.dataset.id, t.value, t); APP.changed(); msg(okMsg); } catch (err) { APP.changed(); msg(err.message); return; } if (t.dataset.ed !== 'me') render(); }
    finally { busy = false; }
  });
  $('serialIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') goSerial(); });
  $('tmain').addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'kwIn') { UI.kw = e.target.value.trim(); render(); } });

  /* ---------- 事件 ---------- */
  APP.on('change', function () { if (!busy) render(); else setTimeout(render, 0); });
  APP.on('me', function () { UI.other = null; render(); });
  APP.on('tut', function (st) { render(); if (st === 'done' && !APP.tut().skipped) msg('教學完成！接下來照「今天」準備自己的規則表、資源表、時段。（第 8 步：看自己的達秒屋，第 2 輪做）'); });
  // 那一微秒：成交那一刻白光一閃、跳出成交結果；沒開著的話，下次打開跳出「你不在的時候」（同一格兩種都有就一起列）
  APP.on('dock', function (res) {
    var m = me().serial, about = function (x) { return x.docking ? (x.docking.a === m || x.docking.b === m) : x.missed === m; };
    var late = res.filter(function (x) { return x.late && about(x); }), nowRes = res.filter(function (x) { return !x.late && x.docking && about(x); });
    render();
    if (!late.length && !nowRes.length) { if (res.some(function (x) { return !x.late && x.missed === m; })) msg('那一微秒過了，沒確認到達的記為錯過。'); return; }
    var lateText = late.map(function (x) { return '・' + CORE.fmtUs(x.slot.atUs).slice(5, 19) + ' ' + x.owner.name + ' 的時段：' + (x.docking ? dockLine(x.docking, m) : '沒確認到達，錯過了'); }).join('\n');
    var nowText = nowRes.map(function (x) { return dockLine(x.docking, m); }).join('\n\n');
    if (nowRes.some(function (x) { return x.docking.traded; })) flash();
    pop(late.length && nowRes.length ? '你不在的時候、到達那微秒' : late.length ? '你不在的時候' : '到達那微秒', late.length && nowRes.length ? '【你不在的時候】\n' + lateText + '\n\n【剛才】\n' + nowText : late.length ? lateText : nowText);
  });
  // 還有幾秒：每秒更新那幾格的字，不重畫整張表
  setInterval(function () { document.querySelectorAll('#tmain [data-left]').forEach(function (el) { el.textContent = leftText(+el.dataset.left); }); }, 1000);

  render();
  return { render: render, ui: UI, tab: tab, visit: visit, home: home, NAMES: NAMES, GROUPS: GROUPS, SHEETS: SHEETS, OTHER: OTHER };
})();

</script>
</body></html>
